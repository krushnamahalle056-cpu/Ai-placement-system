<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Sync - The Hacker Game</title>
    <link rel="stylesheet" href="gamestyle.css">
</head>
<body>
    <h1>Signal Sync</h1>
    <div id="game-board">
        <div class="stats">
            <span>Level: <span id="level-display">1</span></span>
            <span>Target: <span style="color: #ff0055;">Red</span> | You: <span style="color: #00ffcc;">Cyan</span></span>
        </div>
        <!-- Canvas for rendering the waves -->
        <canvas id="oscilloscope" width="600" height="250"></canvas>

        <div class="controls-grid">
            <div class="control-group">
                <label for="waveType">Waveform Type</label>
                <select id="waveType">
                    <option value="sine">Sine Wave</option>
                    <option value="square">Square Wave</option>
                    <option value="triangle">Triangle Wave</option>
                </select>
            </div>

            
            <div class="control-group">
                <label for="frequency">Frequency (Hz)</label>
                <input type="range" id="frequency" min="1" max="10" step="0.5" value="1">
            </div>

            <div class="control-group">
                <label for="amplitude">Amplitude (Gain)</label>
                <input type="range" id="amplitude" min="10" max="100" step="5" value="50">
            </div>

        </div>
    </div>


    <script src="gamejs.js"></script>
</body>
</html>
