<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Sync - The Hacker Game</title>
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <h1>Signal Sync</h1>
    <div id="game-board">
       <div class="stats">
            <span>Level: <span id="level-display">1</span></span>
            <span>Score: <span id="score-display" style="color: #00ffcc;">0</span></span>
            <span>Time: <span id="timer-display" style="color: #ff0055;">15</span>s</span>
        </div>
        <!-- Canvas for rendering the waves -->
        <canvas id="oscilloscope" width="600" height="250"></canvas>

        <div class="controls-grid">
            <div class="control-group">
                <label for="waveType">Waveform Type</label>
                <select id="waveType">
                    <option value="sine">Sine Wave</option>
                    <option value="square">Square Wave</option>
                    <option value="triangle">Triangle Wave</option>
                </select>
            </div>

            
            <div class="control-group">
                <label for="frequency">Frequency (Hz)</label>
                <input type="range" id="frequency" min="1" max="10" step="0.5" value="1">
            </div>

            <div class="control-group">
                <label for="amplitude">Amplitude (Gain)</label>
                <input type="range" id="amplitude" min="10" max="100" step="5" value="50">
            </div>

            <div class="control-group">
                <label for="phase">Phase Shift (Deg)</label>
                <input type="range" id="phase" min="0" max="180" step="45" value="0">
            </div>

        </div>
        
       <!-- Audio Button  -->
        <button id="audio-toggle" onclick="toggleAudio()" style="margin-bottom: 15px; border-color: #00ffcc; color: #00ffcc;">
            Turn On Sound 🔊
        </button>

        <!-- NAYA CODE: Filter Toggle -->
        <div style="margin-bottom: 15px; background: #111; padding: 10px; border: 1px solid #ffaa00; border-radius: 5px; color: #ffaa00; font-weight: bold;">
            <input type="checkbox" id="filterToggle" style="cursor: pointer; transform: scale(1.5); margin-right: 10px;">
            <label for="filterToggle" style="cursor: pointer;">Engage Low-Pass Filter (Remove Noise)</label>
        </div>

        <button onclick="checkSync()">Sync Signal</button>
        <div id="status">Adjust parameters to match the red signal...</div>
        
    </div>


    <script src="gamejs.js"></script>
</body>
</html>
